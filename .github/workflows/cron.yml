# Cron via GitHub Actions — DISABLED. Primary scheduler: OpenClaw engine on Koyeb.
# Schedule triggers removed to avoid duplicate execution. Manual trigger retained.
name: GYEOL Cron Jobs

on:
  workflow_dispatch: # manual trigger only

jobs:
  health:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run health cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/health" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30

  lifeline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run lifeline cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/lifeline" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120

  heartbeat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run heartbeat cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/heartbeat" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300

  time_capsule:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run time-capsule cron
