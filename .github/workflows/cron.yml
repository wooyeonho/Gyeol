# Cron via GitHub Actions (fallback). Primary scheduler: OpenClaw engine on Koyeb.
# Deploy openclaw/ to Koyeb (~$5.36/mo) for reliable cron. This workflow is a backup.
name: GYEOL Cron Jobs

on:
  schedule:
    - cron: "*/30 * * * *"  # health: every 30 min
    - cron: "15,45 * * * *" # lifeline: every 30 min (offset)
    - cron: "0 */2 * * *"   # heartbeat: every 2 hours
    - cron: "0 * * * *"     # time-capsule: every hour
    - cron: "0 4 * * *"     # dream: 04:00 UTC daily
    - cron: "0 3 * * *"     # retention: 03:00 UTC daily
    - cron: "0 */6 * * *"   # social: every 6 hours
    - cron: "0 */6 * * *"   # learner: every 6 hours
    - cron: "0 */8 * * *"   # crawl: every 8 hours
    - cron: "0 10 * * *"    # redemption: 10:00 UTC daily
    - cron: "0 0 * * *"     # world: midnight UTC daily
  workflow_dispatch: # allow manual trigger

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run health cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/health" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30

  lifeline:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15,45 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run lifeline cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/lifeline" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120

  heartbeat:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run heartbeat cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/heartbeat" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  time_capsule:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run time-capsule cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/time-capsule" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  dream:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run dream cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/dream" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  retention:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run retention cleanup cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/retention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  social:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run social cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/social" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  learner:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run learner cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/learner" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120

  crawl:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run web crawl cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/crawl" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 180

  redemption:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run redemption cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/redemption" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30

  world:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run world cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/world" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60
