# Cron via GitHub Actions (OpenClaw). Vercel Hobby = 1 cron/day only.
# See README: Koyeb (OpenClaw cron). Use this workflow or external scheduler.
name: GYEOL Cron Jobs

on:
  schedule:
    - cron: "0 */30 * * *"  # health: every 30 min (HEARTBEAT.md)
    - cron: "0 */2 * * *"   # heartbeat: every 2 hours (AGENT.md/HEARTBEAT.md)
    - cron: "0 4 * * *"     # dream: 04:00 UTC daily (HEARTBEAT.md)
    - cron: "0 */6 * * *"   # social: every 6 hours
    - cron: "0 */6 * * *"   # learner: every 6 hours
    - cron: "0 10 * * *"    # redemption: 10:00 UTC daily
    - cron: "0 0 * * *"     # world: midnight UTC daily (HEARTBEAT.md)
  workflow_dispatch: # allow manual trigger

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */30 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run health cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/health" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30

  heartbeat:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run heartbeat cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/heartbeat" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  dream:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run dream cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/dream" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  social:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run social cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/social" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  learner:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run learner cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/learner" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120

  redemption:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run redemption cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/redemption" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30

  world:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run world cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/world" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60
