name: GYEOL CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - automation/hourly-operator
      - "cursor/**"
      - "claude/**"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage
        run: npx vitest run --coverage 2>&1 | tee coverage-output.txt || true

      - name: Build
        run: npm run build

      - name: Start exact branch build with isolated CI-only runtime placeholders
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-production
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-production
          CRON_SECRET: ci-placeholder-cron-secret-not-production
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/gyeol-next.log 2>&1 &
          echo $! > /tmp/gyeol-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/demo >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gyeol-next.log
          exit 1

      - name: Capture actual companion surface
        run: |
          mkdir -p artifacts
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-family browser found on runner"
            exit 1
          fi
          "$CHROME_BIN" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1000 --screenshot=artifacts/gyeol-desktop.png http://127.0.0.1:3000/demo
          "$CHROME_BIN" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=artifacts/gyeol-mobile.png http://127.0.0.1:3000/demo
          test -s artifacts/gyeol-desktop.png
          test -s artifacts/gyeol-mobile.png

      - name: Upload exact-branch screen evidence
        uses: actions/upload-artifact@v4
        with:
          name: hourly-operator-screen
          path: |
            artifacts/gyeol-desktop.png
            artifacts/gyeol-mobile.png

  dependency-remediation-candidate:
    if: github.ref == 'refs/heads/automation/hourly-operator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile with reviewed overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply semver-compatible audit fixes to candidate lockfile
        run: npm audit fix --package-lock-only || true

      - name: Install candidate lockfile
        run: npm ci

      - name: Verify candidate security audit
        run: npm audit --audit-level=high

      - name: Verify candidate lint
        run: npm run lint

      - name: Verify candidate typecheck
        run: npm run typecheck

      - name: Verify candidate tests
        run: npm run test

      - name: Verify candidate build
        run: npm run build

      - name: Persist verified candidate lockfile on automation branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches verified candidate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Persist verified dependency lock remediation"
          git push origin HEAD:automation/hourly-operator

      - name: Upload reviewed lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          path: package-lock.json
