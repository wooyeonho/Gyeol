name: GYEOL CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "cursor/**"
      - "claude/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-save --legacy-peer-deps vitest eslint typescript && npm install --legacy-peer-deps

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage
        run: npx vitest run --coverage 2>&1 | tee coverage-output.txt || true

      - name: Build
        run: npm run build
