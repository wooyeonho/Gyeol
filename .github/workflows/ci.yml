name: GYEOL CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - automation/hourly-operator
      - "cursor/**"
      - "claude/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage
        run: npx vitest run --coverage 2>&1 | tee coverage-output.txt || true

      - name: Build
        run: npm run build

  dependency-remediation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile with reviewed overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply semver-compatible audit fixes to candidate lockfile
        run: npm audit fix --package-lock-only || true

      - name: Install candidate lockfile
        run: npm ci

      - name: Verify candidate security audit
        run: npm audit --audit-level=high

      - name: Verify candidate lint
        run: npm run lint

      - name: Verify candidate typecheck
        run: npm run typecheck

      - name: Verify candidate tests
        run: npm run test

      - name: Verify candidate build
        run: npm run build

      - name: Upload reviewed lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          path: package-lock.json
